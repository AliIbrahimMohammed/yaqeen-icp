[package]
name = "ceremony"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-ff = "0.4"
ark-ec = "0.4"
ark-bls12-381 = "0.4"
ark-groth16 = "0.4"
ark-relations = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
rand_chacha = "0.3"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "=1.6.0", default-features = false }

# Path dependency: only ceremony_init needs this, to run the real,
# unmodified circuit definition through ark-groth16's own
# generate_parameters_with_qap. ceremony_contribute / ceremony_verify
# never touch the circuit at all — by round 1 they only see opaque
# ProvingKey bytes, which is what keeps them circuit-agnostic and simple
# enough to audit independently of the QAP/R1CS logic.
title_verification = { path = "../circuit" }

[[bin]]
name = "ceremony_init"
path = "src/bin/ceremony_init.rs"

[[bin]]
name = "ceremony_contribute"
path = "src/bin/ceremony_contribute.rs"

[[bin]]
name = "ceremony_verify"
path = "src/bin/ceremony_verify.rs"
